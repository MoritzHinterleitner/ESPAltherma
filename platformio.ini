; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[platformio]
default_envs = adafruit_qtpy_esp32s3_n4r2

[env:adafruit_qtpy_esp32s3_n4r2]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
; Standard ESP32 bootloader + partitions instead of Adafruit's TinyUF2, so the
; reset button just restarts the firmware (TinyUF2 kept landing in UF2 mode).
; Recovery: hold BOOT while pressing RESET -> ROM download mode, flash via USB.
board_build.partitions = default.csv

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    PubSubClient

; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
;upload_port = ESPAltherma.local
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
;upload_protocol = espota

upload_port = 192.168.1.42
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
upload_protocol = espota

[env:nodemcuv2]
platform = espressif8266
framework = arduino
board = nodemcuv2
monitor_speed = 115200
upload_speed = 921600
build_flags = -D_GNU_SOURCE
lib_deps =
	PubSubClient

[env:m5stickc]
platform = espressif32@7.0.1
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
	M5Unified
	PubSubClient

[env:m5stickcplus]
platform = espressif32@7.0.1
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
; upload_port = ESPAltherma.local
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
; upload_protocol = espota

lib_deps =
	M5Unified
	PubSubClient

build_flags = "-D ARDUINO_M5Stick_C_Plus"

[env:m5stickcplus2]
platform = espressif32@7.0.1
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
; upload_port = ESPAltherma.local
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
; upload_protocol = espota

lib_deps =
	M5Unified
	PubSubClient

build_flags = "-D ARDUINO_M5Stick_C_Plus2"

[env:m5stack-sticks3]
platform = espressif32@7.0.1
board = m5stack-sticks3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
; upload_port = ESPAltherma.local
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
; upload_protocol = espota

build_flags = 
	${env.build_flags}
	-D ARDUINO_M5Stick_S3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

lib_deps =
	M5Unified
	PubSubClient


[env:m5stack-tough]
platform = espressif32@7.0.1
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
; upload_port = ESPAltherma.local
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
; upload_protocol = espota

lib_deps = M5Unified
		   PubSubClient

build_flags = "-D ARDUINO_M5Stack_Tough"

[env:esp32c3]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
; upload_port = ESPAltherma.local
; upload_protocol = espota

lib_deps =
    PubSubClient

[env:native]
# Used to run unit test; g++ must be in PATH.
platform = native
build_flags = "-std=c++11"

; Same firmware, flashed over USB (esptool) instead of OTA
[env:qtpy_usb]
extends = env:adafruit_qtpy_esp32s3_n4r2
upload_protocol = esptool
upload_port = /dev/ttyACM0
upload_speed = 921600
